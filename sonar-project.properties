# SonarQube project config (spec 006 / T001). Coverage from Jest (lcov); the
# quality gate stays visibly skipped until the self-hosted server exists.
sonar.projectKey=MicroTodoSuite_todos-api
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*.test.js
sonar.exclusions=**/*.test.js,node_modules/**,coverage/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Bootstrap/wiring excluded from the coverage denominator (research D2).
sonar.coverage.exclusions=server.js,routes.js,jest.config.js
